<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>流感疫苗出入藥庫紀錄登記表</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React 18 UMD -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <!-- Recharts UMD (Depends on React) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/recharts/2.12.7/Recharts.min.js"></script>
    <!-- Babel for JSX compilation -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800">
    <div id="root"></div>

    <!-- Firebase SDKs loaded as ES modules -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, onSnapshot, addDoc, updateDoc, deleteDoc, doc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";
        import { getAnalytics } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-analytics.js";

        window.firebaseAppModules = {
            initializeApp, getAuth, signInAnonymously, signInWithCustomToken,
            getFirestore, collection, onSnapshot, addDoc, updateDoc, deleteDoc, doc, getAnalytics
        };
        window.dispatchEvent(new Event('firebase-loaded'));
    </script>

    <!-- Main React App -->
    <script type="text/babel">
        const { useState, useEffect, useMemo, Component } = React;
        
        // 防呆處理：安全取得 Recharts 元件，避免全域變數抓不到導致白畫面
        const RechartsLib = window.Recharts || window.recharts || {};
        const { 
            BarChart = () => <div className="flex items-center justify-center h-full text-slate-400">圖表載入中...</div>, 
            Bar = () => null, 
            XAxis = () => null, 
            YAxis = () => null, 
            CartesianGrid = () => null, 
            Tooltip = () => null, 
            ResponsiveContainer = ({children}) => <div className="w-full h-full">{children}</div>, 
            Cell = () => null 
        } = RechartsLib;

        // 錯誤邊界元件（Error Boundary）：若內部渲染發生錯誤，顯示友善提示而非全白畫面
        class ErrorBoundary extends Component {
            constructor(props) {
                super(props);
                this.state = { hasError: false, error: null };
            }
            static getDerivedStateFromError(error) {
                return { hasError: true, error };
            }
            componentDidCatch(error, errorInfo) {
                console.error("React Error Caught:", error, errorInfo);
            }
            render() {
                if (this.state.hasError) {
                    return (
                        <div className="min-h-screen bg-slate-50 flex items-center justify-center p-4">
                            <div className="bg-white p-8 rounded-2xl shadow-xl max-w-lg w-full text-center space-y-4 border border-red-100">
                                <div className="w-12 h-12 bg-red-100 text-red-600 rounded-full flex items-center justify-center mx-auto text-xl font-bold">!</div>
                                <h2 className="text-xl font-bold text-slate-800">系統發生了一點小狀況</h2>
                                <p className="text-sm text-slate-500">畫面渲染時發生錯誤，請重新整理頁面。若問題持續發生，請檢查主控台 (F12) 錯誤訊息。</p>
                                <pre className="text-xs bg-slate-100 p-3 rounded-xl text-left overflow-x-auto text-red-600 max-h-32">
                                    {this.state.error?.toString()}
                                </pre>
                                <button onClick={() => window.location.reload()} className="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-2.5 rounded-xl transition">
                                    重新整理頁面
                                </button>
                            </div>
                        </div>
                    );
                }
                return this.props.children;
            }
        }

        const DEFAULT_BRANDS = ['GSK', '高端', '東洋', '國光'];
        const BRAND_COLORS = {
            'GSK': '#3b82f6',   // 藍色
            '高端': '#10b981',   // 綠色
            '東洋': '#f59e0b',   // 黃色/橘色
            '國光': '#8b5cf6'    // 紫色
        };

        const GROUP_COLORS = {
            '員工': '#3b82f6',   // 藍色
            '民眾': '#ec4899'    // 粉紅/桃紅色
        };

        const DEFAULT_UNITS = [
            '13W', '15W', '16W', '17W', '18W', '19W', '22W', '23W', 
            '32W', '33W', '55W', '56W', 'ICU', '2ICU', '3ICU', 'RCW', 
            '門診護理', '員工快打'
        ];

        const firebaseConfig = {
            apiKey: "AIzaSyCTBlEBE3MHiNrOCTc1guLuCtzgfEXBDGA",
            authDomain: "flu-vaccine-tracker.firebaseapp.com",
            projectId: "flu-vaccine-tracker",
            storageBucket: "flu-vaccine-tracker.firebasestorage.app",
            messagingSenderId: "455980415328",
            appId: "1:455980415328:web:7a3104d4cac165522f4605",
            measurementId: "G-WVFTY5YBNF"
        };

        function App() {
            const [isFirebaseReady, setIsFirebaseReady] = useState(false);
            const [dbInstance, setDbInstance] = useState(null);
            const [authInstance, setAuthInstance] = useState(null);
            const [activeTab, setActiveTab] = useState('dashboard');
            const [isFirebaseConnected, setIsFirebaseConnected] = useState(false);
            
            const [brands] = useState(DEFAULT_BRANDS);
            const [units, setUnits] = useState(DEFAULT_UNITS);

            const [inventoryList, setInventoryList] = useState([]);
            const [records, setRecords] = useState([]);
            const [returnList, setReturnList] = useState([]);

            const [newInv, setNewInv] = useState({ date: new Date().toISOString().split('T')[0], brand: DEFAULT_BRANDS[0], batchNo: '', quantity: '', note: '' });
            const [newRec, setNewRec] = useState({ 
                date: new Date().toISOString().split('T')[0], 
                session: '上午', 
                group: '員工', 
                unit: DEFAULT_UNITS[0], 
                brand: DEFAULT_BRANDS[0], 
                batchNo: '', 
                quantity: '' 
            });
            const [newRet, setNewRet] = useState({
                date: new Date().toISOString().split('T')[0],
                unit: DEFAULT_UNITS[0],
                brand: DEFAULT_BRANDS[0],
                batchNo: '',
                quantity: '',
                reason: '多領退回'
            });

            const [editingRecord, setEditingRecord] = useState(null);
            const [chartMetrics, setChartMetrics] = useState(['brand']);

            const [filterBrand, setFilterBrand] = useState('全部');
            const [filterGroup, setFilterGroup] = useState('全部');
            const [filterUnit, setFilterUnit] = useState('全部');
            const [startDate, setStartDate] = useState('');
            const [endDate, setEndDate] = useState('');

            const [notification, setNotification] = useState(null);

            const showAlert = (msg) => {
                setNotification(msg);
                setTimeout(() => setNotification(null), 3000);
            };

            const todayStr = new Date().toISOString().split('T')[0];
            const appId = typeof __app_id !== 'undefined' ? __app_id : 'flu-vaccine-prod';

            useEffect(() => {
                const handleFirebaseLoaded = () => {
                    const mods = window.firebaseAppModules;
                    if (!mods) return;
                    const app = mods.initializeApp(firebaseConfig);
                    const db = mods.getFirestore(app);
                    const auth = mods.getAuth(app);
                    try {
                        mods.getAnalytics(app);
                    } catch(e) {}
                    
                    setDbInstance(db);
                    setAuthInstance(auth);
                    setIsFirebaseReady(true);

                    const initAuth = async () => {
                        try {
                            if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                                await mods.signInWithCustomToken(auth, __initial_auth_token);
                            } else {
                                await mods.signInAnonymously(auth);
                            }
                            setIsFirebaseConnected(true);
                        } catch (err) {
                            console.error("Auth error:", err);
                            setIsFirebaseConnected(false);
                        }
                    };
                    initAuth();
                };

                if (window.firebaseAppModules) {
                    handleFirebaseLoaded();
                } else {
                    window.addEventListener('firebase-loaded', handleFirebaseLoaded);
                }
            }, []);

            useEffect(() => {
                if (!isFirebaseReady || !dbInstance) return;
                const mods = window.firebaseAppModules;
                
                const unsubInv = mods.onSnapshot(
                    mods.collection(dbInstance, 'artifacts', appId, 'public', 'data', 'inventoryList'),
                    (snapshot) => {
                        const items = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                        setInventoryList(items);
                    },
                    (err) => console.error("Inventory sync error:", err)
                );

                const unsubRec = mods.onSnapshot(
                    mods.collection(dbInstance, 'artifacts', appId, 'public', 'data', 'records'),
                    (snapshot) => {
                        const items = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                        setRecords(items);
                    },
                    (err) => console.error("Records sync error:", err)
                );

                const unsubRet = mods.onSnapshot(
                    mods.collection(dbInstance, 'artifacts', appId, 'public', 'data', 'returnList'),
                    (snapshot) => {
                        const items = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                        setReturnList(items);
                    },
                    (err) => console.error("Return sync error:", err)
                );

                const unsubUnits = mods.onSnapshot(
                    mods.collection(dbInstance, 'artifacts', appId, 'public', 'data', 'unitsConfig'),
                    (snapshot) => {
                        const items = snapshot.docs.map(doc => doc.data().name);
                        if (items.length > 0) setUnits(items);
                    },
                    (err) => console.error("Units sync error:", err)
                );

                return () => {
                    unsubInv();
                    unsubRec();
                    unsubRet();
                    unsubUnits();
                };
            }, [isFirebaseReady, dbInstance]);

            useEffect(() => {
                setTimeout(() => {
                    if (window.lucide) window.lucide.createIcons();
                }, 100);
            }, [activeTab, notification, editingRecord]);

            const { stockSummary, todaySummary, recordsWithBalance } = useMemo(() => {
                const summary = {};
                brands.forEach(b => {
                    summary[b] = { totalIn: 0, totalOut: 0, totalReturn: 0, balance: 0 };
                });

                inventoryList.forEach(item => {
                    if (summary[item.brand]) summary[item.brand].totalIn += Number(item.quantity);
                });

                records.forEach(item => {
                    if (summary[item.brand]) summary[item.brand].totalOut += Number(item.quantity);
                });

                returnList.forEach(item => {
                    if (summary[item.brand]) summary[item.brand].totalReturn += Number(item.quantity);
                });

                Object.keys(summary).forEach(b => {
                    summary[b].balance = summary[b].totalIn - summary[b].totalOut + summary[b].totalReturn;
                });

                const sortedRecords = [...records].sort((a, b) => a.date.localeCompare(b.date) || a.id.localeCompare(b.id));
                
                let runningPool = {};
                brands.forEach(b => {
                    runningPool[b] = inventoryList.filter(i => i.brand === b).reduce((s, x) => s + Number(x.quantity), 0)
                                   + returnList.filter(r => r.brand === b).reduce((s, x) => s + Number(x.quantity), 0);
                });

                const evaluatedRecords = sortedRecords.map(r => {
                    runningPool[r.brand] = (runningPool[r.brand] !== undefined ? runningPool[r.brand] : 0) - Number(r.quantity);
                    return {
                        ...r,
                        remainingStockAfter: runningPool[r.brand]
                    };
                });

                const tStats = {
                    employee: { 上午: {}, 下午: {}, total: 0 },
                    public: { 上午: {}, 下午: {}, total: 0 },
                    outCount: 0,
                    returnCount: 0
                };

                records.filter(r => r.date === todayStr).forEach(r => {
                    const targetGroup = r.group === '員工' ? tStats.employee : tStats.public;
                    const targetSession = r.session === '上午' ? targetGroup.上午 : targetGroup.下午;
                    targetSession[r.brand] = (targetSession[r.brand] || 0) + Number(r.quantity);
                    targetGroup.total += Number(r.quantity);
                    tStats.outCount += Number(r.quantity);
                });

                returnList.filter(r => r.date === todayStr).forEach(r => {
                    tStats.returnCount += Number(r.quantity);
                });

                return { stockSummary: summary, todaySummary: tStats, recordsWithBalance: evaluatedRecords.reverse() };
            }, [inventoryList, records, returnList, brands, todayStr]);

            const filteredRecords = useMemo(() => {
                return records.filter(r => {
                    if (filterBrand !== '全部' && r.brand !== filterBrand) return false;
                    if (filterGroup !== '全部' && r.group !== filterGroup) return false;
                    if (filterUnit !== '全部' && r.unit !== filterUnit) return false;
                    if (startDate && r.date < startDate) return false;
                    if (endDate && r.date > endDate) return false;
                    return true;
                });
            }, [records, filterBrand, filterGroup, filterUnit, startDate, endDate]);

            const chartData = useMemo(() => {
                const map = {};
                filteredRecords.forEach(r => {
                    let keyParts = [];
                    if (chartMetrics.includes('brand')) keyParts.push(r.brand);
                    if (chartMetrics.includes('unit')) keyParts.push(r.unit);
                    if (chartMetrics.includes('group')) keyParts.push(r.group);
                    if (chartMetrics.includes('session')) keyParts.push(r.session);

                    const compositeKey = keyParts.length > 0 ? keyParts.join(' / ') : r.brand;
                    
                    if (!map[compositeKey]) {
                        map[compositeKey] = { name: compositeKey, 支數: 0, brand: r.brand, group: r.group };
                    }
                    map[compositeKey].支數 += Number(r.quantity);
                });
                return Object.values(map);
            }, [filteredRecords, chartMetrics]);

            const getBarColor = (entry) => {
                if (chartMetrics.length === 1 && chartMetrics[0] === 'brand' && BRAND_COLORS[entry.name]) {
                    return BRAND_COLORS[entry.name];
                }
                if (chartMetrics.length === 1 && chartMetrics[0] === 'group' && GROUP_COLORS[entry.name]) {
                    return GROUP_COLORS[entry.name];
                }
                if (entry.brand && BRAND_COLORS[entry.brand] && chartMetrics.includes('brand')) {
                    return BRAND_COLORS[entry.brand];
                }
                if (entry.group && GROUP_COLORS[entry.group] && chartMetrics.includes('group')) {
                    return GROUP_COLORS[entry.group];
                }
                return '#3b82f6';
            };

            const exportAllLogsCSV = () => {
                let csvContent = "\uFEFF"; 
                csvContent += "類別,日期,時段,族群,單位,廠牌,批號,支數,備註/原因\n";

                inventoryList.forEach(i => {
                    csvContent += `衛生所入庫,${i.date},-, -, -,${i.brand},${i.batchNo},${i.quantity},${i.note || ''}\n`;
                });
                records.forEach(r => {
                    csvContent += `出庫施打,${r.date},${r.session},${r.group},${r.unit},${r.brand},${r.batchNo || ''},${r.quantity},-\n`;
                });
                returnList.forEach(r => {
                    csvContent += `退庫回補,${r.date},-, -,${r.unit},${r.brand},${r.batchNo || ''},${r.quantity},${r.reason || ''}\n`;
                });

                const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
                const url = URL.createObjectURL(blob);
                const link = document.createElement('a');
                link.setAttribute('href', url);
                link.setAttribute('download', `流感疫苗出入庫總清單_${todayStr}.csv`);
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
                showAlert('成功匯出所有清單 CSV 檔案！');
            };

            return (
                <div className="min-h-screen bg-slate-50 text-slate-800 flex flex-col font-sans">
                    <header className="bg-blue-600 text-white shadow-md sticky top-0 z-50">
                        <div className="max-w-7xl mx-auto px-4 py-3 flex flex-col md:flex-row justify-between items-center gap-3">
                            <div className="flex items-center space-x-3">
                                <i data-lucide="shield-check" className="w-8 h-8 text-blue-200"></i>
                                <div>
                                    <div className="flex items-center gap-2">
                                        <h1 className="text-xl font-bold tracking-wide">流感疫苗出入藥庫與施打登記系統</h1>
                                        <span className={`inline-flex items-center gap-1 text-xs px-2 py-0.5 rounded-full font-medium ${isFirebaseConnected ? 'bg-emerald-500 text-white' : 'bg-amber-500 text-white'}`}>
                                            {isFirebaseConnected ? <i data-lucide="cloud" className="w-3 h-3"></i> : <i data-lucide="cloud-off" className="w-3 h-3"></i>}
                                            {isFirebaseConnected ? '雲端同步中' : '連線中...'}
                                        </span>
                                    </div>
                                    <p className="text-xs text-blue-100">衛生所發給、藥庫出退庫控管與多維度長條圖分析</p>
                                </div>
                            </div>
                            
                            <nav className="flex flex-wrap gap-1 bg-blue-700 p-1 rounded-xl shadow-inner">
                                <button onClick={() => setActiveTab('dashboard')} className={`px-3 py-2 rounded-lg text-sm font-medium transition flex items-center gap-1.5 ${activeTab === 'dashboard' ? 'bg-white text-blue-700 shadow' : 'text-white hover:bg-blue-600'}`}>
                                    <i data-lucide="bar-chart-3" className="w-4 h-4"></i> 今日總覽儀表板
                                </button>
                                <button onClick={() => setActiveTab('inventory')} className={`px-3 py-2 rounded-lg text-sm font-medium transition flex items-center gap-1.5 ${activeTab === 'inventory' ? 'bg-white text-blue-700 shadow' : 'text-white hover:bg-blue-600'}`}>
                                    <i data-lucide="package-plus" className="w-4 h-4"></i> 衛生所撥發入庫
                                </button>
                                <button onClick={() => setActiveTab('record')} className={`px-3 py-2 rounded-lg text-sm font-medium transition flex items-center gap-1.5 ${activeTab === 'record' ? 'bg-white text-blue-700 shadow' : 'text-white hover:bg-blue-600'}`}>
                                    <i data-lucide="clipboard-list" className="w-4 h-4"></i> 出庫施打登記
                                </button>
                                <button onClick={() => setActiveTab('return')} className={`px-3 py-2 rounded-lg text-sm font-medium transition flex items-center gap-1.5 ${activeTab === 'return' ? 'bg-white text-blue-700 shadow' : 'text-white hover:bg-blue-600'}`}>
                                    <i data-lucide="rotate-ccw" className="w-4 h-4"></i> 退庫紀錄
                                </button>
                                <button onClick={() => setActiveTab('stats')} className={`px-3 py-2 rounded-lg text-sm font-medium transition flex items-center gap-1.5 ${activeTab === 'stats' ? 'bg-white text-blue-700 shadow' : 'text-white hover:bg-blue-600'}`}>
                                    <i data-lucide="filter" className="w-4 h-4"></i> 統計圖表與區間
                                </button>
                                <button onClick={() => setActiveTab('allLogs')} className={`px-3 py-2 rounded-lg text-sm font-medium transition flex items-center gap-1.5 ${activeTab === 'allLogs' ? 'bg-white text-blue-700 shadow' : 'text-white hover:bg-blue-600'}`}>
                                    <i data-lucide="download" className="w-4 h-4"></i> 總清單與匯出
                                </button>
                                <button onClick={() => setActiveTab('settings')} className={`px-3 py-2 rounded-lg text-sm font-medium transition flex items-center gap-1.5 ${activeTab === 'settings' ? 'bg-white text-blue-700 shadow' : 'text-white hover:bg-blue-600'}`}>
                                    <i data-lucide="settings" className="w-4 h-4"></i> 單位設定
                                </button>
                            </nav>
                        </div>
                    </header>

                    {notification && (
                        <div className="fixed bottom-5 right-5 z-50 bg-slate-900 text-white px-4 py-3 rounded-xl shadow-xl flex items-center gap-3 animate-bounce">
                            <i data-lucide="check-circle-2" className="w-5 h-5 text-emerald-400"></i>
                            <span>{notification}</span>
                        </div>
                    )}

                    <main className="flex-1 max-w-7xl w-full mx-auto p-4 md:p-6 space-y-6">
                        {activeTab === 'dashboard' && (
                            <div className="space-y-6">
                                <div className="bg-gradient-to-r from-blue-600 to-indigo-700 text-white p-6 rounded-2xl shadow-md flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
                                    <div>
                                        <span className="bg-blue-500/50 text-white text-xs px-2.5 py-1 rounded-full font-bold uppercase tracking-wider">今日即時總覽</span>
                                        <h2 className="text-2xl font-extrabold mt-2">今日日期：{todayStr}</h2>
                                        <p className="text-blue-100 text-sm mt-1">呈現員工與民眾在上下午分別施打的廠牌與總支數，以及疫苗總庫存狀態。</p>
                                    </div>
                                    <div className="flex gap-3">
                                        <div className="bg-white/15 backdrop-blur px-4 py-3 rounded-xl text-center">
                                            <div className="text-xs text-blue-100 font-medium">今日總施打</div>
                                            <div className="text-2xl font-black">{todaySummary.outCount} 支</div>
                                        </div>
                                        <div className="bg-white/15 backdrop-blur px-4 py-3 rounded-xl text-center">
                                            <div className="text-xs text-blue-100 font-medium">今日退回</div>
                                            <div className="text-2xl font-black">{todaySummary.returnCount} 支</div>
                                        </div>
                                    </div>
                                </div>

                                <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                                    <div className="bg-white p-6 rounded-2xl shadow-sm border border-slate-200">
                                        <div className="flex justify-between items-center mb-4 pb-3 border-b">
                                            <h3 className="text-lg font-bold text-slate-800 flex items-center gap-2">
                                                <span className="w-3 h-3 bg-blue-600 rounded-full"></span> 員工今日施打統計
                                            </h3>
                                            <span className="text-sm font-bold bg-blue-50 text-blue-600 px-3 py-1 rounded-full">
                                                總計: {todaySummary.employee.total} 支
                                            </span>
                                        </div>
                                        <div className="grid grid-cols-2 gap-4">
                                            <div className="bg-slate-50 p-4 rounded-xl border">
                                                <div className="text-xs font-bold text-amber-600 mb-2">上午時段</div>
                                                {Object.keys(todaySummary.employee.上午).length === 0 ? (
                                                    <div className="text-xs text-slate-400">尚無紀錄</div>
                                                ) : (
                                                    Object.entries(todaySummary.employee.上午).map(([brand, count]) => (
                                                        <div key={brand} className="flex justify-between text-sm py-1">
                                                            <span className="text-slate-600">{brand}:</span>
                                                            <span className="font-bold text-slate-800">{count} 支</span>
                                                        </div>
                                                    ))
                                                )}
                                            </div>
                                            <div className="bg-slate-50 p-4 rounded-xl border">
                                                <div className="text-xs font-bold text-indigo-600 mb-2">下午時段</div>
                                                {Object.keys(todaySummary.employee.下午).length === 0 ? (
                                                    <div className="text-xs text-slate-400">尚無紀錄</div>
                                                ) : (
                                                    Object.entries(todaySummary.employee.下午).map(([brand, count]) => (

                        {activeTab === 'stats' && (
                            <div className="space-y-6">
                                <div className="bg-white p-6 rounded-2xl shadow-sm border border-slate-200 space-y-4">
                                    <h3 className="text-lg font-bold text-slate-800 flex items-center gap-2">
                                        <i data-lucide="filter" className="w-5 h-5 text-blue-600"></i> 圖表條件與日期區間篩選
                                    </h3>
                                    
                                    <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-5 gap-4">
                                        <div>
                                            <label className="block text-xs font-bold text-slate-500 mb-1">廠牌篩選</label>
                                            <select value={filterBrand} onChange={e => setFilterBrand(e.target.value)} className="w-full p-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm">
                                                <option value="全部">全部廠牌</option>
                                                {brands.map(b => <option key={b} value={b}>{b}</option>)}
                                            </select>
                                        </div>
                                        <div>
                                            <label className="block text-xs font-bold text-slate-500 mb-1">族群篩選</label>
                                            <select value={filterGroup} onChange={e => setFilterGroup(e.target.value)} className="w-full p-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm">
                                                <option value="全部">全部族群</option>
                                                <option value="員工">員工</option>
                                                <option value="民眾">民眾</option>
                                            </select>
                                        </div>
                                        <div>
                                            <label className="block text-xs font-bold text-slate-500 mb-1">單位篩選</label>
                                            <select value={filterUnit} onChange={e => setFilterUnit(e.target.value)} className="w-full p-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm">
                                                <option value="全部">全部單位</option>
                                                {units.map(u => <option key={u} value={u}>{u}</option>)}
                                            </select>
                                        </div>
                                        <div>
                                            <label className="block text-xs font-bold text-slate-500 mb-1">區間起日 (Head)</label>
                                            <input type="date" value={startDate} onChange={e => setStartDate(e.target.value)} className="w-full p-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm" />
                                        </div>
                                        <div>
                                            <label className="block text-xs font-bold text-slate-500 mb-1">區間迄日 (Tail)</label>
                                            <input type="date" value={endDate} onChange={e => setEndDate(e.target.value)} className="w-full p-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm" />
                                        </div>
                                    </div>

                                    <div className="flex justify-between items-center pt-2 border-t border-slate-100">
                                        <span className="text-xs text-slate-500">提示：廠牌固定對應4色（GSK藍、高端綠、東洋黃、國光紫），族群固定對應2色（員工藍、民眾粉紅）。</span>
                                        <button onClick={() => { setFilterBrand('全部'); setFilterGroup('全部'); setFilterUnit('全部'); setStartDate(''); setEndDate(''); showAlert('已重置篩選'); }} className="px-4 py-2 bg-slate-100 hover:bg-slate-200 text-slate-600 rounded-xl text-xs font-bold transition">
                                            清除篩選
                                        </button>
                                    </div>
                                </div>

                                <div className="bg-white p-6 rounded-2xl shadow-sm border border-slate-200 space-y-6">
                                    <div className="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4">
                                        <div>
                                            <h3 className="text-lg font-bold text-slate-800">視覺化長條圖分析 (可複選維度)</h3>
                                            <p className="text-xs text-slate-500 mt-0.5">點擊下方按鈕可同時選取多個維度進行交叉統計圖表呈現。</p>
                                        </div>
                                        
                                        <div className="flex flex-wrap gap-1.5 bg-slate-100 p-1.5 rounded-xl">
                                            {[
                                                { id: 'brand', label: '廠牌' },
                                                { id: 'unit', label: '單位' },
                                                { id: 'group', label: '族群' },
                                                { id: 'session', label: '時段' }
                                            ].map(metric => {
                                                const isSelected = chartMetrics.includes(metric.id);
                                                return (
                                                    <button
                                                        key={metric.id}
                                                        onClick={() => {
                                                            if (isSelected) {
                                                                if (chartMetrics.length > 1) {
                                                                    setChartMetrics(chartMetrics.filter(m => m !== metric.id));
                                                                } else {
                                                                    showAlert('至少須保留一個統計維度');
                                                                }
                                                            } else {
                                                                setChartMetrics([...chartMetrics, metric.id]);
                                                            }
                                                        }}
                                                        className={`px-3 py-1.5 rounded-lg text-xs font-bold transition ${isSelected ? 'bg-blue-600 text-white shadow' : 'bg-white text-slate-600 hover:bg-slate-200'}`}
                                                    >
                                                        {isSelected ? '✓ ' : '+ '}{metric.label}
                                                    </button>
                                                );
                                            })}
                                        </div>
                                    </div>

                                    <div className="h-80">
                                        <ResponsiveContainer width="100%" height="100%">
                                            <BarChart data={chartData}>
                                                <CartesianGrid strokeDasharray="3 3" />
                                                <XAxis dataKey="name" angle={-25} textAnchor="end" height={60} />
                                                <YAxis />
                                                <Tooltip />
                                                <Bar dataKey="支數" radius={[6, 6, 0, 0]}>
                                                    {chartData.map((entry, index) => (
                                                        <Cell key={`cell-${index}`} fill={getBarColor(entry)} />
                                                    ))}
                                                </Bar>
                                            </BarChart>
                                        </ResponsiveContainer>
                                    </div>
                                </div>
                            </div>
                        )}

                        {activeTab === 'allLogs' && (
                            <div className="space-y-6">
                                <div className="bg-white p-6 rounded-2xl shadow-sm border border-slate-200 flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4">
                                    <div>
                                        <h3 className="text-lg font-bold text-slate-800">所有入庫 / 出庫 / 退庫總清單匯出</h3>
                                        <p className="text-xs text-slate-500 mt-1">您可以一鍵將系統內所有的疫苗異動紀錄匯出成 CSV 檔案進行備份或報表列印。</p>
                                    </div>
                                    <button onClick={exportAllLogsCSV} className="bg-emerald-600 hover:bg-emerald-700 text-white font-bold px-5 py-3 rounded-xl shadow transition text-sm flex items-center gap-2">
                                        <i data-lucide="download" className="w-5 h-5"></i> 匯出所有清單 (CSV)
                                    </button>
                                </div>

                                <div className="bg-white p-6 rounded-2xl shadow-sm border border-slate-200">
                                    <h3 className="text-lg font-bold text-slate-800 mb-4">清單總覽預覽</h3>
                                    <div className="overflow-x-auto">
                                        <table className="w-full text-left border-collapse">
                                            <thead>
                                                <tr className="border-b border-slate-200 text-xs text-slate-500 uppercase">
                                                    <th className="py-3 px-4">異動類型</th>
                                                    <th className="py-3 px-4">日期</th>
                                                    <th className="py-3 px-4">時段/單位</th>
                                                    <th className="py-3 px-4">族群</th>
                                                    <th className="py-3 px-4">廠牌 / 批號</th>
                                                    <th className="py-3 px-4 text-right">數量</th>
                                                </tr>
                                            </thead>
                                            <tbody className="divide-y divide-slate-100 text-sm">
                                                {inventoryList.map(i => (
                                                    <tr key={i.id} className="hover:bg-slate-50">
                                                        <td className="py-3 px-4"><span className="px-2 py-0.5 bg-blue-50 text-blue-700 rounded text-xs font-bold">衛生所入庫</span></td>
                                                        <td className="py-3 px-4">{i.date}</td>
                                                        <td className="py-3 px-4">-</td>
                                                        <td className="py-3 px-4">-</td>
                                                        <td className="py-3 px-4">{i.brand} <span className="text-xs text-slate-400">({i.batchNo})</span></td>
                                                        <td className="py-3 px-4 text-right font-bold text-emerald-600">+{i.quantity}</td>
                                                    </tr>
                                                ))}
                                                {records.map(r => (
                                                    <tr key={r.id} className="hover:bg-slate-50">
                                                        <td className="py-3 px-4"><span className="px-2 py-0.5 bg-emerald-50 text-emerald-700 rounded text-xs font-bold">出庫施打</span></td>
                                                        <td className="py-3 px-4">{r.date}</td>
                                                        <td className="py-3 px-4">{r.session} / {r.unit}</td>
                                                        <td className="py-3 px-4">{r.group}</td>
                                                        <td className="py-3 px-4">{r.brand} <span className="text-xs text-slate-400">({r.batchNo || '-'})</span></td>
                                                        <td className="py-3 px-4 text-right font-bold text-emerald-600">-{r.quantity}</td>
                                                    </tr>
                                                ))}
                                                {returnList.map(ret => (
                                                    <tr key={ret.id} className="hover:bg-slate-50">
                                                        <td className="py-3 px-4"><span className="px-2 py-0.5 bg-amber-50 text-amber-700 rounded text-xs font-bold">退庫回補</span></td>
                                                        <td className="py-3 px-4">{ret.date}</td>
                                                        <td className="py-3 px-4">{ret.unit}</td>
                                                        <td className="py-3 px-4">-</td>
                                                        <td className="py-3 px-4">{ret.brand} <span className="text-xs text-slate-400">({ret.batchNo || '-'})</span></td>
                                                        <td className="py-3 px-4 text-right font-bold text-amber-600">+{ret.quantity}</td>
                                                    </tr>
                                                ))}
                                            </tbody>
                                        </table>
                                    </div>
                                </div>
                            </div>
                        )}

                        {activeTab === 'settings' && (
                            <div className="space-y-6">
                                <div className="bg-white p-6 rounded-2xl shadow-sm border border-slate-200">
                                    <h3 className="text-lg font-bold text-slate-800 mb-2 flex items-center gap-2">
                                        <i data-lucide="settings" className="w-5 h-5 text-blue-600"></i> 員工單位與護理站清單管理
                                    </h3>
                                    <p className="text-sm text-slate-500 mb-6">可隨時新增或移除護理站與特殊單位。</p>
                                    
                                    <div className="flex gap-2 max-w-md mb-6">
                                        <input 
                                            type="text" 
                                            id="newUnitInput"
                                            placeholder="輸入新單位名稱 (例如: 21W)"
                                            className="flex-1 p-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm"
                                            onKeyDown={async (e) => {
                                                if (e.key === 'Enter') {
                                                    const val = e.target.value.trim();
                                                    if (val && !units.includes(val)) {
                                                        const mods = window.firebaseAppModules;
                                                        try {
                                                            await mods.addDoc(mods.collection(dbInstance, 'artifacts', appId, 'public', 'data', 'unitsConfig'), { name: val });
                                                            e.target.value = '';
                                                            showAlert('成功新增單位！');
                                                        } catch (err) {
                                                            console.error(err);
                                                        }
                                                    }
                                                }
                                            }}
                                        />
                                        <button 
                                            onClick={async () => {
                                                const input = document.getElementById('newUnitInput');
                                                const val = input.value.trim();
                                                if (val && !units.includes(val)) {
                                                    const mods = window.firebaseAppModules;
                                                    try {
                                                        await mods.addDoc(mods.collection(dbInstance, 'artifacts', appId, 'public', 'data', 'unitsConfig'), { name: val });
                                                        input.value = '';
                                                        showAlert('成功新增單位！');
                                                    } catch (err) {
                                                        console.error(err);
                                                    }
                                                }
                                            }}
                                            className="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2.5 rounded-xl font-bold text-sm transition"
                                        >
                                            新增單位
                                        </button>
                                    </div>

                                    <div className="flex flex-wrap gap-2">
                                        {units.map(u => (
                                            <div key={u} className="flex items-center gap-2 bg-slate-100 px-3 py-1.5 rounded-xl text-sm font-semibold text-slate-700">
                                                <span>{u}</span>
                                            </div>
                                        ))}
                                    </div>
                                </div>

                                <div className="bg-white p-6 rounded-2xl shadow-sm border border-slate-200">
                                    <h3 className="text-lg font-bold text-slate-800 mb-4">流感疫苗廠牌與專屬顏色對應</h3>
                                    <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
                                        {brands.map(b => (
                                            <div key={b} className="p-4 rounded-2xl text-white font-bold flex justify-between items-center shadow-sm" style={{ backgroundColor: BRAND_COLORS[b] }}>
                                                <span>{b}</span>
                                                <span className="text-xs bg-white/20 px-2 py-1 rounded">專屬色</span>
                                            </div>
                                        ))}
                                    </div>
                                </div>
                            </div>
                        )}
                    </main>

                    {editingRecord && (
                        <div className="fixed inset-0 bg-black/50 backdrop-blur-sm z-50 flex items-center justify-center p-4">
                            <div className="bg-white max-w-lg w-full p-6 rounded-2xl shadow-2xl space-y-4">
                                <div className="flex justify-between items-center border-b pb-3">
                                    <h3 className="text-lg font-bold text-slate-800 flex items-center gap-2">
                                        <i data-lucide="edit-2" className="w-5 h-5 text-blue-600"></i> 編輯出庫施打登記
                                    </h3>
                                    <button onClick={() => setEditingRecord(null)} className="text-slate-400 hover:text-slate-600">
                                        <i data-lucide="x" className="w-5 h-5"></i>
                                    </button>
                                </div>

                                <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                                    <div>
                                        <label className="block text-xs font-bold text-slate-500 mb-1">日期</label>
                                        <input type="date" value={editingRecord.date} onChange={e => setEditingRecord({...editingRecord, date: e.target.value})} className="w-full p-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm" />
                                    </div>
                                    <div>
                                        <label className="block text-xs font-bold text-slate-500 mb-1">時段</label>
                                        <select value={editingRecord.session} onChange={e => setEditingRecord({...editingRecord, session: e.target.value})} className="w-full p-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm">
                                            <option value="上午">上午</option>
                                            <option value="下午">下午</option>
                                        </select>
                                    </div>
                                    <div>
                                        <label className="block text-xs font-bold text-slate-500 mb-1">族群</label>
                                        <select value={editingRecord.group} onChange={e => setEditingRecord({...editingRecord, group: e.target.value})} className="w-full p-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm">
                                            <option value="員工">員工</option>
                                            <option value="民眾">民眾</option>
                                        </select>
                                    </div>
                                    <div>
                                        <label className="block text-xs font-bold text-slate-500 mb-1">單位</label>
                                        <select value={editingRecord.unit} onChange={e => setEditingRecord({...editingRecord, unit: e.target.value})} className="w-full p-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm">
                                            {units.map(u => <option key={u} value={u}>{u}</option>)}
                                        </select>
                                    </div>
                                    <div>
                                        <label className="block text-xs font-bold text-slate-500 mb-1">廠牌</label>
                                        <select value={editingRecord.brand} onChange={e => setEditingRecord({...editingRecord, brand: e.target.value})} className="w-full p-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm">
                                            {brands.map(b => <option key={b} value={b}>{b}</option>)}
                                        </select>
                                    </div>
                                    <div>
                                        <label className="block text-xs font-bold text-slate-500 mb-1">出庫支數</label>
                                        <input type="number" value={editingRecord.quantity} onChange={e => setEditingRecord({...editingRecord, quantity: Number(e.target.value)})} className="w-full p-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm" />
                                    </div>
                                </div>

                                <div className="flex justify-end gap-2 pt-4 border-t">
                                    <button onClick={() => setEditingRecord(null)} className="px-4 py-2 bg-slate-100 hover:bg-slate-200 text-slate-600 rounded-xl font-bold text-sm transition">取消</button>
                                    <button onClick={async () => {
                                        const mods = window.firebaseAppModules;
                                        try {
                                            const { id, ...dataToUpdate } = editingRecord;
                                            await mods.updateDoc(mods.doc(dbInstance, 'artifacts', appId, 'public', 'data', 'records', id), dataToUpdate);
                                            setEditingRecord(null);
                                            showAlert('成功更新登記紀錄！');
                                        } catch (err) {
                                            console.error(err);
                                        }
                                    }} className="px-4 py-2 bg-blue-600 hover:bg-blue-700 text-white rounded-xl font-bold text-sm transition flex items-center gap-1.5">
                                        <i data-lucide="save" className="w-4 h-4"></i> 儲存變更
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(
            <ErrorBoundary>
                <App />
            </ErrorBoundary>
        );
    </script>
</body>
</html>
